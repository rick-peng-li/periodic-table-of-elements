<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素周期表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            overflow-x: auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, minmax(70px, 1fr));
            gap: 3px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .element {
            position: relative;
            background: rgba(30, 30, 40, 0.8);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            min-height: 75px;
        }

        .element::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle 100px at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.15), transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .element:hover::before {
            opacity: 1;
        }

        .element:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 30px var(--glow-color, rgba(100, 200, 255, 0.5));
        }

        .element .number {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .element .symbol {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            margin: 2px 0;
        }

        .element .name {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .element .mass {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty {
            visibility: hidden;
        }

        .alkali { background: linear-gradient(135deg, rgba(255, 99, 71, 0.3), rgba(255, 99, 71, 0.1)); --glow-color: rgba(255, 99, 71, 0.6); }
        .alkaline { background: linear-gradient(135deg, rgba(255, 165, 0, 0.3), rgba(255, 165, 0, 0.1)); --glow-color: rgba(255, 165, 0, 0.6); }
        .transition { background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05)); --glow-color: rgba(255, 215, 0, 0.5); }
        .post-transition { background: linear-gradient(135deg, rgba(50, 205, 50, 0.3), rgba(50, 205, 50, 0.1)); --glow-color: rgba(50, 205, 50, 0.6); }
        .metalloid { background: linear-gradient(135deg, rgba(0, 206, 209, 0.3), rgba(0, 206, 209, 0.1)); --glow-color: rgba(0, 206, 209, 0.6); }
        .nonmetal { background: linear-gradient(135deg, rgba(30, 144, 255, 0.3), rgba(30, 144, 255, 0.1)); --glow-color: rgba(30, 144, 255, 0.6); }
        .halogen { background: linear-gradient(135deg, rgba(138, 43, 226, 0.3), rgba(138, 43, 226, 0.1)); --glow-color: rgba(138, 43, 226, 0.6); }
        .noble { background: linear-gradient(135deg, rgba(255, 20, 147, 0.3), rgba(255, 20, 147, 0.1)); --glow-color: rgba(255, 20, 147, 0.6); }
        .lanthanide { background: linear-gradient(135deg, rgba(0, 255, 127, 0.25), rgba(0, 255, 127, 0.05)); --glow-color: rgba(0, 255, 127, 0.5); }
        .actinide { background: linear-gradient(135deg, rgba(255, 105, 180, 0.25), rgba(255, 105, 180, 0.05)); --glow-color: rgba(255, 105, 180, 0.5); }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .separator {
            grid-column: span 18;
            height: 20px;
        }

        .lanthanide-row, .actinide-row {
            grid-column: 3 / span 15;
            display: contents;
        }
    </style>
</head>
