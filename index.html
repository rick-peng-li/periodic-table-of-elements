<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素周期表 - 发光效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            overflow-x: auto;
        }

        h1 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 60px);
            grid-template-rows: repeat(10, 70px);
            gap: 4px;
            padding: 20px;
        }

        .element {
            position: relative;
            width: 60px;
            height: 70px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .element::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.3) 0%,
                transparent 50%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .element:hover::before {
            opacity: 1;
        }

        .element:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 30px var(--glow-color, rgba(0, 255, 255, 0.6));
        }

        .element-number {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            position: absolute;
            top: 4px;
            left: 6px;
        }

        .element-symbol {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px currentColor;
        }

        .element-name {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-top: 2px;
        }

        .element-mass {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.6);
            position: absolute;
            bottom: 4px;
        }

        /* 元素类别颜色 */
        .alkali-metal { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); --glow-color: rgba(255, 107, 107, 0.6); }
        .alkaline-earth { background: linear-gradient(135deg, #feca57, #ff9f43); --glow-color: rgba(254, 202, 87, 0.6); }
        .transition-metal { background: linear-gradient(135deg, #48dbfb, #0abde3); --glow-color: rgba(72, 219, 251, 0.6); }
        .post-transition { background: linear-gradient(135deg, #1dd1a1, #10ac84); --glow-color: rgba(29, 209, 161, 0.6); }
        .metalloid { background: linear-gradient(135deg, #5f27cd, #341f97); --glow-color: rgba(95, 39, 205, 0.6); }
        .nonmetal { background: linear-gradient(135deg, #54a0ff, #2e86de); --glow-color: rgba(84, 160, 255, 0.6); }
        .halogen { background: linear-gradient(135deg, #00d2d3, #01a3a4); --glow-color: rgba(0, 210, 211, 0.6); }
        .noble-gas { background: linear-gradient(135deg, #ff9ff3, #f368e0); --glow-color: rgba(255, 159, 243, 0.6); }
        .lanthanide { background: linear-gradient(135deg, #ff6348, #e55039); --glow-color: rgba(255, 99, 72, 0.6); }
        .actinide { background: linear-gradient(135deg, #f368e0, #9b59b6); --glow-color: rgba(243, 104, 224, 0.6); }
        .unknown { background: linear-gradient(135deg, #576574, #222f3e); --glow-color: rgba(87, 101, 116, 0.6); }

        /* 图例 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            max-width: 1200px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 12px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .periodic-table {
                grid-template-columns: repeat(18, 45px);
                grid-template-rows: repeat(10, 55px);
                gap: 2px;
            }
            .element {
                width: 45px;
                height: 55px;
            }
            .element-symbol {
                font-size: 14px;
            }
            .element-name, .element-mass, .element-number {
                font-size: 6px;
            }
        }
    </style>
</head>
